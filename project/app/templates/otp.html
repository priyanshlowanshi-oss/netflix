<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Verify OTP</title>
  
  <!-- 🔥 बूटस्ट्रैप 5 का सही CSS CDN लिंक -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #141414; /* नेटफ्लिक्स का डार्क बैकग्राउंड */
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      /* flex-column: column; */
    }
    
    /* 🎯 डिब्बे को हमेशा स्क्रीन के बीच (Center) में रखने के लिए कस्टम ग्रिड */
    .main-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      padding: 20px 0;
    }
    
    /* नेटफ्लिक्स लोगो स्टाइल */
    .netflix-logo {
      color: #E50914;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
    }

    /* ओटीपी कार्ड कंटेनर */
    .otp-card {
      background-color: rgba(0, 0, 0, 0.75);
      border-radius: 4px;
      padding: 60px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #333;
    }

    /* सिंगल ओटीपी इनपुट बॉक्स */
    .otp-box {
      width: 60px;
      height: 60px;
      background-color: #333 !important;
      border: 1px solid #333 !important;
      color: #fff !important;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 4px;
      transition: border-color 0.2s ease;
    }

    .otp-box:focus {
      border-color: #E50914 !important;
      box-shadow: none !important;
    }

    /* नेटफ्लिक्स रेड बटन */
    .btn-netflix {
      background-color: #E50914;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      padding: 12px;
      border: none;
      border-radius: 4px;
      width: 100%; /* बटन पूरा बड़ा रखने के लिए */
      transition: background 0.2s ease;
    }

    .btn-netflix:hover {
      background-color: #BF0912;
      color: #fff;
    }
  </style>
</head>
<body class="d-flex flex-column justify-content-between">

  <!-- Header Section (Logo) -->
  <header class="p-4">
    <div class="container-fluid">
      <a href="#" class="netflix-logo">NETFLIX</a>
    </div>
  </header>

  <!-- 🎯 Main Content Container (यह हिस्से को पूरी स्क्रीन के बीच में रखेगा) -->
  <main class="main-wrapper">
    <div class="otp-card text-white">
      <h2 class="fw-bold mb-3">Two-Step Verification</h2>
      <p class="text-secondary mb-4" style="font-size: 0.95rem;">
        हम आपके रजिस्टर्ड नंबर/ईमेल पर 4-अंकों का वेरिफिकेशन कोड भेजा है। कृपया नीचे दर्ज करें।
      </p>


      
     <form id="otpForm" action="{% url 'nav' %}" method="post">
    {% csrf_token %}

    <div class="d-flex justify-content-between gap-2 mb-4">
        <input type="text" maxlength="1" class="form-control text-center otp-box" required autocomplete="off">
        <input type="text" maxlength="1" class="form-control text-center otp-box" required autocomplete="off">
        <input type="text" maxlength="1" class="form-control text-center otp-box" required autocomplete="off">
        <input type="text" maxlength="1" class="form-control text-center otp-box" required autocomplete="off">
    </div>

    <button type="submit" class="btn btn-netflix mb-3">
        Verify & Sign In
    </button>
</form>

      <!-- Resend & Support Links -->
      <div class="d-flex justify-content-between align-items-center mt-3" style="font-size: 0.85rem;">
        <span class="text-secondary">कोड नहीं मिला?</span>
        <a href="{% url 'user'%}" class="text-white text-decoration-none fw-bold hover-underline">Back to sing up</a>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="p-4 text-center text-secondary" style="font-size: 0.8rem; background-color: rgba(0,0,0,0.2);">
    This page is protected by Google reCAPTCHA to ensure you're not a bot.
  </footer>

  <!-- 🔥 बूटस्ट्रैप 5 का सही JS Bundle CDN लिंक -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Auto-focus JavaScript -->
  <script>
    const inputs = document.querySelectorAll('.otp-box');

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    document.getElementById('otpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      let otpValue = "";
      inputs.forEach(input => otpValue += input.value);
      alert("दर्ज किया गया OTP: " + otpValue);
    });
  </script> 
</body>
</html>
