
{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix - Edit Profile</title>
  <!-- Bootstrap 5 CSS CDN -->
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">  
  <style>
    body {
      background-color: #141414; /* नेटफ्लिक्स डार्क बैकग्राउंड */
      color: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }


        /* जब किसी अवतार पर माउस जाए */
    .avatar-option:hover {
    transform: scale(1.1);
    border-color: #555 !important;
    transition: all 0.2s ease;
    }

    /* जो अवतार सिलेक्टेड (Active) है */
    .avatar-option.active {
    border-color: #E50914 !important; /* नेटफ्लिक्स रेड बॉर्डर */
    box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
    }



    .netflix-logo {
      color: #E50914;
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
    }

    /* मुख्य प्रोफाइल कार्ड */
    .profile-container {
      max-width: 600px;
      margin: 60px auto;
      background-color: #000000;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 40px;
    }

    /* इनपुट बॉक्स स्टाइलिंग */
    .custom-input {
      background-color: #333333 !important;
      border: 1px solid #333333 !important;
      color: #ffffff !important;
      padding: 12px;
      font-size: 1rem;
      border-radius: 4px;
    }

    .custom-input:focus {
      border-color: #E50914 !important;
      box-shadow: none !important;
    }

    /* ईमेल बॉक्स (सिर्फ दिखने के लिए - Disabled) */
    .custom-input:disabled {
      background-color: #1f1f1f !important;
      border-color: #1f1f1f !important;
      color: #8c8c8c !important;
      cursor: not-allowed;
    }

    /* नेटफ्लिक्स बटन्स */
    .btn-save {
      background-color: #E50914;
      color: #ffffff;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .btn-save:hover {
      background-color: #BF0912;
      color: #ffffff;
    }

    .btn-cancel {
      background-color: transparent;
      color: #8c8c8c;
      border: 1px solid #8c8c8c;
      font-weight: bold;
      padding: 12px 30px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-cancel:hover {
      color: #ffffff;
      border-color: #ffffff;
    }
  </style>
</head>
<body class="d-flex flex-column justify-content-between">

  <!-- Top Navbar -->
  <header class="p-3 border-bottom border-dark" style="background-color: #000000;">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="#" class="netflix-logo">NETFLIX</a>
      <a href="{% url 'nav'%}" class="text-white text-decoration-none fs-5"><i class="bi bi-house-door"></i></a>
    </div>
  </header>

  <!-- Main Profile Section -->
  <main class="container px-3 flex-grow-1 d-flex align-items-center">
    <div class="profile-container shadow-lg w-100">
      
      <h2 class="fw-bold mb-4 fs-2 border-bottom border-secondary pb-3">Edit Profile</h2>
      
      <!-- Django Form Start -->
     <!-- Django Form Start -->
<form method="POST" action="" id="profileForm">
  {% csrf_token %}
  
  <!-- 1. मुख्य अवतार जो अभी सिलेक्टेड है -->
  <div class="text-center mb-5">
    <div class="position-relative d-inline-block">
      <!-- यह मुख्य फोटो है जो ऊपर दिखाई देगी -->
      <img id="currentAvatar" src="https://dicebear.com" alt="Current Avatar" class="rounded-circle border border-4 border-danger" style="width: 120px; height: 120px; background-color: #222;">
      <span class="position-absolute bottom-0 end-0 bg-danger text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; border: 2px solid #000;">
        <i class="bi bi-check-lg"></i>
      </span>
    </div>
    <h5 class="mt-3 fw-bold text-white-50">Choose Your Avatar</h5>
  </div>

  <!-- 2. अवतार चुनने का ग्रिड (9 ऑप्शन्स) -->
  <div class="row row-cols-3 row-cols-md-3 g-3 justify-content-center mb-5 mx-auto" style="max-width: 450px;">
    
    <!-- अवतार 1 -->
    <div class="col text-center"> 
    <img src="{% static 'photos/5190433.jpg' %}"
     class="img-fluid rounded-circle avatar-option active"
     onclick="selectAvatar(this)"
     style="width:80px;height:80px;cursor:pointer;border:3px solid transparent;background:#1f1f1f;">
    </div>
    <!-- अवतार 2 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 3 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 4 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 5 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 6 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 7 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 8 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>
    <!-- अवतार 9 -->
    <div class="col text-center">
      <img src="https://dicebear.com" class="img-fluid rounded-circle avatar-option" onclick="selectAvatar(this)" style="width: 80px; height: 80px; cursor: pointer; border: 3px solid transparent; background-color: #1f1f1f;">
    </div>

  </div>

  <!-- छुपा हुआ इनपुट बॉक्स (यह चुने हुए अवतार का लिंक Django बैकएंड में भेजेगा) -->
  <input type="hidden" name="selected_avatar" id="selectedAvatarInput" value="https://dicebear.com">

  <!-- 3. नाम और ईमेल इनपुट फील्ड्स -->
  <div class="mb-4">
    <label for="profileName" class="form-label text-secondary fw-semibold">Name</label>
    <input type="text" class="form-control custom-input" id="profileName" name="name" value="User" required>
  </div>

  <div class="mb-4">
    <label for="profileEmail" class="form-label text-secondary fw-semibold">Email Address</label>
    <input type="email" class="form-control custom-input" id="profileEmail" value="{{ user.email|default:'user@gmail.com' }}" disabled>
  </div>

  <!-- बटन्स -->
  <div class="d-flex gap-3 mt-5 border-top border-secondary pt-4">
    <button type="submit" class="btn btn-save">Save Changes</button>
    <a href="#" class="btn btn-cancel text-decoration-none text-center">Cancel</a>
  </div>

</form>


    </div>
  </main>

  <!-- Footer Section -->
  <footer class="p-4 text-center text-secondary border-top border-dark" style="font-size: 0.8rem; background-color: #000000;">
    © 2026 Netflix India Clone. All privileges reserved.
  </footer>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  function selectAvatar(element) {
    // 1. पुराने सिलेक्टेड अवतार से लाल बॉर्डर (active class) हटाएं
    document.querySelectorAll('.avatar-option').forEach(img => {
      img.classList.remove('active');
    });

    // 2. नए क्लिक किए गए अवतार पर लाल बॉर्डर लगाएं
    element.classList.add('active');

    // 3. क्लिक किए गए अवतार की फोटो का लिंक लेकर मुख्य ऊपर वाली फोटो बदलें
    const newAvatarSrc = element.src;
    document.getElementById('currentAvatar').src = newAvatarSrc;

    // 4. छुपे हुए (Hidden) इनपुट बॉक्स में इसका लिंक डाल दें ताकि Django इसे डेटाबेस में सेव कर सके
    document.getElementById('selectedAvatarInput').value = newAvatarSrc;
  }
</script>

</body>
</html>
