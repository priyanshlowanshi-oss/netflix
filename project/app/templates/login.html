<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://nflxext.com'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-brand { 
            position: absolute;
            top: 20px;
            left: 50px;
            color: #e50914 !important; 
            font-weight: bold; 
            font-size: 35px; 
            text-decoration: none;
        }

        .login-box {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 50px 60px;
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
        }

        .login-box h1 { margin-bottom: 25px; font-weight: bold; }

        /* INPUT LABELS STYLE */
        .form-label {
            font-size: 0.9rem;
            color: #cbcbcb;
            margin-bottom: 8px;
            font-weight: 500;
            display: block;
        }

        .form-control {
            background: #333;
            border: none;
            color: white;
            height: 55px;
            margin-bottom: 20px;
            padding-left: 15px;
        }

        .form-control:focus {
            background: #454545;
            color: white;
            box-shadow: none;
            border-bottom: 2px solid #e87c03;
        }

        .btn-netflix {
            background-color: #e50914;
            color: white;
            font-weight: bold;
            height: 50px;
            width: 100%;
            margin-top: 15px;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-netflix:hover { background-color: #b20710; color: white; }

        .footer-text { color: #737373; margin-top: 25px; font-size: 0.9rem; }
        .footer-text a { color: white; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        .form-check-label { color: #b3b3b3; font-size: 0.85rem; }
        .forgot-link { color: #b3b3b3; text-decoration: none; font-size: 0.85rem; }
        .forgot-link:hover { text-decoration: underline; }

        @media (max-width: 500px) {
            .login-box { padding: 30px; margin: 20px; }
            .navbar-brand { left: 20px; font-size: 28px; }
        }
    </style>
</head>
<body>

    <a class="navbar-brand" href="{% url 'nlogo' %}">NETFLIX</a>

    <div class="login-box">
        <h1>LOGIN</h1>
        
        <!-- Django Messages (Error/Success) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            <!-- Django Active CSRF Token -->
            {% csrf_token %}
            
            <!-- Email or Phone Field with Top Label -->
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="text" name="email_or_phone" class="form-control" placeholder="Enter email or phone number" required>
            </div>
            
            <!-- Password Field with Top Label -->
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <!-- Sign In Button -->
            <button type="submit" class="btn btn-netflix">login In</button>
                <a href="{% url 'reset' %}" class="forgot-link">Forgot Password?</a>

            
            <!-- Remember Me & Need Help Options -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="form-check p-0 m-0 d-flex align-items-center gap-2">
                    <input type="checkbox" name="remember_me" class="form-check-input bg-secondary border-0" id="remember">
                       <!-- Aligned to the extreme right -->
            
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-link">Need help?</a>
            </div>
            
            <!-- Footer Registration Link -->
            <div class="footer-text">
                New to Netflix? <a href="{% url 'user' %}">Sign up now</a>.
                <p class="mt-3" style="font-size: 0.75rem; color: #737373;">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
            </div>
        </form>
    </div>

</body>
</html>
